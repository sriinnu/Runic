name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Same gates Scripts/release.sh and .githooks/pre-commit enforce.
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftFormat and SwiftLint
        run: brew install swiftformat swiftlint
      - name: SwiftFormat
        run: swiftformat Sources Tests --lint
      - name: SwiftLint
        run: swiftlint --strict

  macos:
    name: Build and test (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-macos-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-macos-
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Build CLI
        run: swift build --product RunicCLI
      - name: Test
        run: swift test
