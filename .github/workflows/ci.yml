name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job on purpose: hosted macOS runners are scarce, and a second job can
  # sit in the queue until GitHub cancels it.
  macos:
    name: Lint, build and test (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      # Same gates Scripts/release.sh and .githooks/pre-commit enforce.
      - name: Install SwiftFormat and SwiftLint
        run: brew install swiftformat swiftlint
      - name: SwiftFormat
        run: swiftformat Sources Tests --lint
      - name: SwiftLint
        run: swiftlint --strict
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-macos-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-macos-
      - name: Build
        run: swift build
      - name: Test
        run: swift test
