name: Publish npm

# Stages @sriinnu/runic when a GitHub release is published (Scripts/release.sh
# publishes it last). A staged version goes live only after the maintainer
# approves it with 2FA (npmjs.com, or `npm stage approve <id>`); this workflow
# can't make anything live on its own. Re-run by hand for an existing tag with
# "Run workflow".
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v2.13.4
        required: true

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Stage @sriinnu/runic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      # Signs the npm provenance attestation, and is the npm trusted publishing
      # credential (configured for this workflow + environment on npmjs.com).
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check versions agree
        run: |
          pkg=$(node -p "require('./package.json').version")
          env=$(sed -n 's/^MARKETING_VERSION=//p' version.env)
          [[ "v$pkg" == "$TAG" && "$env" == "$pkg" ]] || {
            echo "::error::tag $TAG, package.json $pkg and version.env $env disagree"; exit 1; }
          echo "VERSION=$pkg" >> "$GITHUB_ENV"
      # Auth is npm trusted publishing (OIDC via id-token above); no token exists.
      - name: Stage
        run: |
          name=$(node -p "require('./package.json').name")
          if [[ "$(npm view "$name@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$name@$VERSION is already on npm."
            exit 0
          fi
          npm stage publish --provenance --access public
          echo "::notice::$name@$VERSION is staged. Approve it on npmjs.com or with 'npm stage approve'."
